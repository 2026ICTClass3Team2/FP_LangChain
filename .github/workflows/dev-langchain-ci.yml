name: LangChain Dev CI

# 1. When should this run?
on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

# 2. What should it do?
jobs:
  build-llm:
    name: Build and Test LLM Service
    runs-on: ubuntu-latest

    steps:
      # Step A: Grab your code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step B: Set up Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Change to match your exact Python version!
          cache: 'pip' # CRITICAL: This caches massive AI libraries so builds don't take 20 minutes

      # Step C: Install packages
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step D: Test the Dockerfile build
      - name: Test Docker Build
        run: docker build -t education-llm:test .